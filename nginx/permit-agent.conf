# Reverse-proxy config for the permit-agent container.
#
# Deployment on this host (matches the pattern used by other
# sites-available/* confs here):
#   1. Replace server_name below with the real domain once DNS is pointed
#      at this box.
#   2. sudo cp nginx/permit-agent.conf /etc/nginx/sites-available/<domain>
#      sudo ln -s /etc/nginx/sites-available/<domain> /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d <domain>
#      — certbot rewrites this file in place to add the 443/ssl_certificate
#      block and an http->https redirect.
#
# The container publishes on 127.0.0.1:3007 (see docker-compose.yml).
#
# proxy_buffering off is not optional here: the chat endpoint streams its
# response incrementally (see backend/main.py's StreamingResponse). With
# buffering on, nginx will silently collect the whole response before
# forwarding it, and the chat UI will appear to hang until the full answer
# is ready instead of streaming token-by-token.

upstream permit_agent {
    server 127.0.0.1:3007;
}

server {
    listen 80;
    server_name your-domain.example.com;

    # Chat requests carry conversation history in the JSON body; the default
    # 1m is fine for this app's payloads but bumped slightly for headroom.
    client_max_body_size 10m;

    location / {
        proxy_pass http://permit_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://permit_agent;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the streamed chat response to reach the browser
        # incrementally instead of arriving as one blob at the end.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # Chat turns can run long (subagent delegation, AHJ crawling, tool
        # calls) — the default read timeout will cut the stream off
        # mid-response, especially on a cache-miss (first-time AHJ) turn.
        proxy_read_timeout 300s;
    }
}
